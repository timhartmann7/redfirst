name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # make check ends with `go mod tidy` plus a diff on go.mod and go.sum:
      # a slice that grew a dependency fails here.
      - run: make check
      # The hot path carries benchmarks, so CI runs them. The deterministic
      # half of the budget is already a test inside make check: allocations
      # that do not grow with the diff. A numeric threshold on wall clock
      # needs a stored baseline and waits for the release slice, because a
      # shared runner's timings would otherwise fail a green branch.
      - run: make bench
